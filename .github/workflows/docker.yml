name: Build and Push Docker (simple)

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Feature branches build (Dockerfile validation) but do NOT push, so
      # :latest only ever holds main — otherwise a feature push would
      # overwrite :latest and a manual deployMcp could ship unmerged code.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/lsfusion/mcp:latest

      # Redeploy production only from main. Runs after the image is pushed,
      # so the deployMcp job (pulls :latest on ai.lsfusion.org) sees the new
      # image. Jenkins API-token requests are CSRF-crumb-exempt, so a plain
      # authenticated POST is enough.
      - name: Trigger MCP redeploy (Jenkins deployMcp)
        if: github.ref == 'refs/heads/main'
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -u "$JENKINS_USER:$JENKINS_TOKEN" \
            "https://jenkins.lsfusion.org/job/deployMcp/build"

